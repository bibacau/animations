<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>T-POT Lyric World</title>
<style>
  @font-face { font-family: 'Anton'; src: url('/node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2') format('woff2'); }
  html, body { margin: 0; background: #000; height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { height: 100vh; width: auto; display: block; }
  #ui { position: fixed; left: 8px; bottom: 8px; color: #fff; font: 12px monospace; }
</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<script type="module" src="/engine/main.js"></script>
<script type="module">
  // interactive preview: ?preview=1 plays the song and renders in real time
  const qs = new URLSearchParams(location.search);
  if (qs.get('preview')) {
    const wait = () => new Promise((r) => { const i = setInterval(() => { if (window.__ready) { clearInterval(i); r(); } }, 50); });
    await wait();
    const audio = new Audio('/assets/audio/tpot_song.mp3');
    document.body.addEventListener('click', () => { audio.currentTime = +(qs.get('t') || 0); audio.play(); }, { once: true });
    const ui = document.getElementById('ui'); ui.textContent = 'click to play';
    const loop = () => { window.renderAt(audio.currentTime || +(qs.get('t') || 0)); ui.textContent = audio.currentTime.toFixed(2); requestAnimationFrame(loop); };
    loop();
  }
</script>
</body>
</html>
